name: Check Power Outage Schedule

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Завантажити код
        uses: actions/checkout@v4

      - name: Встановити Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Встановити бібліотеки
        run: pip install -r requirements.txt

      - name: Запустити парсер
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python bot.py

      - name: Зберегти новий стан графіка
        run: |
          git config user.name "Bot"
          git config user.email "bot@users.noreply.github.com"
          git add last_schedule.txt || true
          git commit -m "Update schedule" || exit 0
          git push
